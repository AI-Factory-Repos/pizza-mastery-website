<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe — Pizza Mastery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav-container">
      <a href="/" class="nav-logo">🍕 Pizza Mastery</a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="compare.html" class="nav-link">Compare</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="container recipe-page-container">
      <div class="recipe-page-nav">
        <a href="index.html" class="back-link">← Back to Recipes</a>
        <div class="recipe-page-nav-right">
          <a id="compare-link" href="compare.html" class="compare-toggle-btn hidden">⚖ Compare Styles</a>
          <div class="print-btn-wrapper">
            <button class="print-btn" id="print-btn" onclick="window.print()" title="Print this recipe">🖨 Print Recipe</button>
          </div>
        </div>
      </div>

      <!-- Print-only header (hidden on screen, shown in print via CSS) -->
      <div class="print-header" style="display:none;">
        <div class="print-site-name">Pizza Mastery — pizzamastery.com</div>
      </div>

      <div id="recipe-detail" class="recipe-detail">
        <div class="skeleton-hero"></div>
        <div class="skeleton-text" style="width:60%;height:2rem;margin:1rem 0"></div>
        <div class="skeleton-text" style="width:90%;height:1rem;margin-bottom:0.5rem"></div>
        <div class="skeleton-text" style="width:80%;height:1rem;margin-bottom:1.5rem"></div>
        <div class="skeleton-text" style="width:100%;height:1rem;margin-bottom:0.4rem"></div>
        <div class="skeleton-text" style="width:100%;height:1rem;margin-bottom:0.4rem"></div>
        <div class="skeleton-text" style="width:70%;height:1rem"></div>
      </div>

      <!-- Print-only QR code section (hidden on screen) -->
      <div class="print-qr-section" id="print-qr-section" style="display:none;">
        <p class="qr-label">Scan to view the full interactive recipe online:</p>
        <img class="qr-img" id="qr-img" src="" alt="QR code linking to this recipe">
        <p class="qr-url" id="qr-url"></p>
      </div>

      <div id="error-msg" class="error-msg hidden"></div>
    </div>
  </main>

  <footer class="site-footer">
    <p>🔥 Crafted with passion &amp; wood-fired tradition</p>
  </footer>

  <script src="js/recipe.js"></script>
  <script src="js/print-recipe.js"></script>
</body>
</html>
